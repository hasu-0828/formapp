<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>新しいフォームを作成</title>


    <style>

        /* =========================================
           基本設定
           ========================================= */

        * {
            box-sizing: border-box;
        }


        html {
            min-height: 100%;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                "Hiragino Mincho Pro",
                "MS PMincho",
                serif;

            color: #eee9df;

            background:

                radial-gradient(
                    circle at 78% 12%,
                    rgba(224, 220, 196, 0.16) 0,
                    rgba(224, 220, 196, 0.07) 8%,
                    transparent 25%
                ),

                radial-gradient(
                    ellipse at 20% 70%,
                    rgba(111, 82, 126, 0.18),
                    transparent 42%
                ),

                radial-gradient(
                    ellipse at 70% 100%,
                    rgba(66, 103, 112, 0.20),
                    transparent 45%
                ),

                linear-gradient(
                    145deg,
                    #09131c 0%,
                    #101e2a 42%,
                    #151d2b 70%,
                    #080f17 100%
                );

            overflow-x: hidden;

            position: relative;

        }


        /* =========================================
           霧
           ========================================= */

        body::before {

            content: "";

            position: fixed;

            left: -10%;
            bottom: 5%;

            width: 120%;
            height: 180px;

            background:
                radial-gradient(
                    ellipse,
                    rgba(205, 212, 211, 0.06),
                    transparent 70%
                );

            filter: blur(25px);

            pointer-events: none;

        }


        body::after {

            content: "";

            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            height: 32%;

            background:

                repeating-linear-gradient(
                    175deg,
                    transparent 0,
                    transparent 22px,
                    rgba(157, 182, 183, 0.035) 23px,
                    transparent 24px
                );

            opacity: 0.8;

            pointer-events: none;

        }


        /* =========================================
           月
           ========================================= */

        .moon {

            position: fixed;

            top: 55px;
            right: 9%;

            width: 125px;
            height: 125px;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle at 35% 32%,
                    #fffdf3,
                    #e8e4d5 55%,
                    #c8c6ba
                );

            opacity: 0.82;

            box-shadow:

                0 0 25px
                rgba(255, 249, 220, 0.20),

                0 0 80px
                rgba(221, 217, 191, 0.08);

            z-index: 0;

            pointer-events: none;

        }


        .moon::before {

            content: "";

            position: absolute;

            width: 18px;
            height: 18px;

            border-radius: 50%;

            background:
                rgba(150, 148, 137, 0.10);

            top: 30px;
            left: 28px;

            box-shadow:

                30px 18px 0
                rgba(150, 148, 137, 0.07),

                12px 53px 0
                rgba(150, 148, 137, 0.08),

                55px 62px 0
                rgba(150, 148, 137, 0.06);

        }


        /* =========================================
           星
           ========================================= */

        .stars {

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 0;

        }


        .stars span {

            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background:
                rgba(238, 233, 214, 0.55);

            box-shadow:
                0 0 5px
                rgba(238, 233, 214, 0.25);

        }


        .star1 {
            top: 16%;
            left: 18%;
        }

        .star2 {
            top: 25%;
            left: 42%;
        }

        .star3 {
            top: 11%;
            left: 62%;
        }

        .star4 {
            top: 38%;
            left: 83%;
        }

        .star5 {
            top: 52%;
            left: 11%;
        }

        .star6 {
            top: 67%;
            left: 91%;
        }

        .star7 {
            top: 79%;
            left: 28%;
        }


        /* =========================================
           蓮の光
           ========================================= */

        .lotus-light {

            position: fixed;

            bottom: 65px;
            left: 7%;

            width: 150px;
            height: 80px;

            opacity: 0.24;

            z-index: 0;

            pointer-events: none;

        }


        .lotus-light::before,
        .lotus-light::after {

            content: "";

            position: absolute;

            bottom: 0;

            width: 75px;
            height: 42px;

            border-radius:
                100% 0 100% 0;

            border:
                1px solid
                rgba(211, 166, 186, 0.45);

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(187, 121, 150, 0.16),
                    transparent 70%
                );

        }


        .lotus-light::before {

            left: 18px;

            transform:
                rotate(-25deg);

        }


        .lotus-light::after {

            right: 18px;

            transform:
                scaleX(-1)
                rotate(-25deg);

        }


        /* =========================================
           白狐の光
           ========================================= */

        .fox-light {

            position: fixed;

            right: 4%;

            bottom: 8%;

            width: 170px;
            height: 130px;

            opacity: 0.18;

            z-index: 0;

            pointer-events: none;

        }


        .fox-light::before {

            content: "";

            position: absolute;

            width: 110px;
            height: 65px;

            right: 10px;
            bottom: 20px;

            border-radius:
                70% 55% 65% 45%;

            background:
                radial-gradient(
                    ellipse,
                    rgba(245, 244, 234, 0.45),
                    rgba(221, 221, 214, 0.08) 70%,
                    transparent 75%
                );

            filter: blur(4px);

        }


        .fox-light::after {

            content: "";

            position: absolute;

            width: 115px;
            height: 45px;

            right: 40px;
            bottom: 8px;

            border-radius: 50%;

            border-top:
                2px solid
                rgba(242, 240, 225, 0.30);

            transform:
                rotate(-18deg);

            filter: blur(1px);

        }


        /* =========================================
           メイン
           ========================================= */

        .container {

            position: relative;

            z-index: 2;

            width:
                min(700px, calc(100% - 40px));

            margin: 0 auto;

            padding: 65px 0 45px;

        }


        /* =========================================
           ヘッダー
           ========================================= */

        header {

            text-align: center;

            margin-bottom: 40px;

        }


        .kigo {

            color: #c99bae;

            font-size: 12px;

            letter-spacing: 8px;

            margin-bottom: 18px;

            opacity: 0.85;

        }


        h1 {

            margin: 0;

            color: #f7f3eb;

            font-size: 36px;

            font-weight: normal;

            letter-spacing: 7px;

            text-shadow:
                0 2px 20px
                rgba(255,255,255,0.08);

        }


        .subtitle {

            margin-top: 17px;

            color: #aeb9bf;

            font-size: 13px;

            letter-spacing: 3px;

        }


        .header-line {

            width: 130px;

            height: 1px;

            margin: 25px auto 0;

            background:
                linear-gradient(
                    to right,
                    transparent,
                    rgba(205, 171, 151, 0.65),
                    transparent
                );

        }


        /* =========================================
           作成パネル
           ========================================= */

        .form-panel {

            border:
                1px solid
                rgba(207, 190, 165, 0.20);

            background:
                linear-gradient(
                    135deg,
                    rgba(20, 30, 39, 0.92),
                    rgba(12, 21, 29, 0.88)
                );

            border-radius: 8px;

            padding: 38px 42px;

            box-shadow:

                0 20px 60px
                rgba(0,0,0,0.35),

                inset 0 1px 0
                rgba(255,255,255,0.035);

            backdrop-filter:
                blur(10px);

        }


        /* =========================================
           説明文
           ========================================= */

        .panel-title {

            margin: 0 0 30px;

            color: #d4c6b5;

            font-size: 16px;

            font-weight: normal;

            letter-spacing: 3px;

            text-align: center;

        }


        /* =========================================
           入力項目
           ========================================= */

        .field {

            margin-bottom: 27px;

        }


        .field label {

            display: block;

            margin-bottom: 10px;

            color: #cbbda8;

            font-size: 13px;

            letter-spacing: 2px;

        }


        .required {

            margin-left: 6px;

            color: #c99bae;

            font-size: 10px;

        }


        input[type="text"],
        textarea {

            width: 100%;

            border:
                1px solid
                rgba(204, 188, 162, 0.22);

            border-radius: 4px;

            outline: none;

            color: #eee9df;

            background:
                rgba(5, 13, 20, 0.58);

            font-family: inherit;

            font-size: 15px;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;

        }


        input[type="text"] {

            height: 50px;

            padding: 0 15px;

        }


        textarea {

            min-height: 150px;

            padding: 14px 15px;

            resize: vertical;

            line-height: 1.8;

        }


        input[type="text"]::placeholder,
        textarea::placeholder {

            color: #66747b;

        }


        input[type="text"]:focus,
        textarea:focus {

            border-color:
                rgba(203, 163, 178, 0.60);

            background:
                rgba(10, 19, 27, 0.75);

            box-shadow:

                0 0 0 3px
                rgba(192, 138, 161, 0.06),

                0 0 20px
                rgba(192, 138, 161, 0.05);

        }


        /* =========================================
           ボタン
           ========================================= */

        .button-area {

            display: flex;

            justify-content: center;

            gap: 15px;

            margin-top: 35px;

        }


        .create-button,
        .back-button {

            display: inline-block;

            min-width: 145px;

            padding: 13px 25px;

            border-radius: 4px;

            font-family: inherit;

            font-size: 13px;

            letter-spacing: 3px;

            text-align: center;

            text-decoration: none;

            cursor: pointer;

            transition:
                0.25s ease;

        }


        .create-button {

            border:
                1px solid
                rgba(203, 163, 178, 0.55);

            color: #f6eee9;

            background:
                linear-gradient(
                    135deg,
                    rgba(117, 71, 92, 0.72),
                    rgba(68, 54, 76, 0.78)
                );

            box-shadow:

                0 8px 30px
                rgba(0,0,0,0.25),

                inset 0 1px 0
                rgba(255,255,255,0.08);

        }


        .create-button:hover {

            transform:
                translateY(-2px);

            background:
                linear-gradient(
                    135deg,
                    rgba(142, 88, 111, 0.82),
                    rgba(82, 64, 91, 0.88)
                );

            box-shadow:

                0 12px 35px
                rgba(0,0,0,0.32),

                0 0 20px
                rgba(192, 138, 161, 0.08);

        }


        .back-button {

            border:
                1px solid
                rgba(170, 180, 184, 0.22);

            color: #aeb9bf;

            background:
                rgba(70, 82, 88, 0.18);

        }


        .back-button:hover {

            color: #e1ddd5;

            border-color:
                rgba(190, 198, 200, 0.38);

            background:
                rgba(90, 100, 105, 0.25);

        }


        /* =========================================
           フッター
           ========================================= */

        footer {

            margin-top: 30px;

            text-align: center;

            color: #69767c;

            font-size: 11px;

            letter-spacing: 3px;

        }


        /* =========================================
           スマートフォン
           ========================================= */

        @media (max-width: 650px) {

            .container {

                width:
                    calc(100% - 24px);

                padding-top: 40px;

            }


            .moon {

                width: 85px;
                height: 85px;

                top: 30px;
                right: 5%;

                opacity: 0.6;

            }


            h1 {

                font-size: 27px;

                letter-spacing: 5px;

            }


            .subtitle {

                font-size: 10px;

                letter-spacing: 2px;

            }


            .form-panel {

                padding: 28px 20px;

            }


            .button-area {

                flex-direction: column;

            }


            .create-button,
            .back-button {

                width: 100%;

            }


            .fox-light {

                right: -30px;

                bottom: 5%;

                opacity: 0.12;

            }


            .lotus-light {

                left: -25px;

                opacity: 0.16;

            }

        }

    </style>

</head>


<body>


<!-- =========================================
     背景装飾
     ========================================= -->

<div class="moon"></div>


<div class="stars">

    <span class="star1"></span>
    <span class="star2"></span>
    <span class="star3"></span>
    <span class="star4"></span>
    <span class="star5"></span>
    <span class="star6"></span>
    <span class="star7"></span>

</div>


<div class="lotus-light"></div>

<div class="fox-light"></div>



<!-- =========================================
     メイン
     ========================================= -->

<div class="container">


    <!-- =====================================
         ヘッダー
         ===================================== -->

    <header>

        <div class="kigo">
            ─　蓮　─
        </div>


        <h1>
            新しいフォーム
        </h1>


        <div class="subtitle">
            問いをひとつ、静かに始める
        </div>


        <div class="header-line"></div>

    </header>



    <!-- =====================================
         フォーム作成
         ===================================== -->

    <div class="form-panel">


        <h2 class="panel-title">
            フォームの基本情報
        </h2>


        <form
            th:action="@{/form/create}"
            method="post">


            <!-- フォームタイトル -->

            <div class="field">

                <label for="title">

                    フォームタイトル

                    <span class="required">
                        必須
                    </span>

                </label>


                <input
                    id="title"
                    type="text"
                    name="title"
                    placeholder="例：イベント参加アンケート"
                    required>

            </div>



            <!-- 説明 -->

            <div class="field">

                <label for="description">

                    説明

                </label>


                <textarea
                    id="description"
                    name="description"
                    placeholder="このフォームについての説明を入力してください。"></textarea>

            </div>



            <!-- ボタン -->

            <div class="button-area">


                <a
                    href="/"
                    class="back-button">

                    戻る

                </a>


                <button
                    type="submit"
                    class="create-button">

                    フォームを作成

                </button>


            </div>


        </form>

    </div>



    <!-- =====================================
         フッター
         ===================================== -->

    <footer>

        ❖　静寂の中に、ひとつの問いを　❖

    </footer>


</div>


</body>

</html>
