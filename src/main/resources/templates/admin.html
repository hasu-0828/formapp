<!DOCTYPE html>
<html
    lang="ja"
    xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>管理者画面 - 蓮狐</title>


<style>

    /* =========================================
       基本
       ========================================= */

    * {
        box-sizing: border-box;
    }


    html {
        min-height: 100%;
    }


    body {

        margin: 0;

        min-height: 100vh;

        font-family:
            "Yu Mincho",
            "Hiragino Mincho ProN",
            "Noto Serif JP",
            serif;

        color: #302d42;

        background:

            radial-gradient(
                circle at 15% 20%,
                rgba(216, 195, 245, 0.55),
                transparent 28%
            ),

            radial-gradient(
                circle at 85% 15%,
                rgba(255, 238, 192, 0.35),
                transparent 24%
            ),

            radial-gradient(
                circle at 70% 80%,
                rgba(188, 215, 238, 0.35),
                transparent 30%
            ),

            linear-gradient(
                135deg,
                #f8f5fc 0%,
                #eeebf7 45%,
                #e7edf5 100%
            );

        position: relative;

        overflow-x: hidden;
    }


    /* =========================================
       背景の幻想的な光
       ========================================= */

    body::before {

        content: "";

        position: fixed;

        width: 420px;

        height: 420px;

        top: -180px;

        right: -100px;

        border-radius: 50%;

        background:

            radial-gradient(
                circle,
                rgba(255, 248, 218, 0.75) 0%,
                rgba(255, 248, 218, 0.25) 45%,
                transparent 70%
            );

        filter: blur(10px);

        pointer-events: none;
    }


    body::after {

        content: "";

        position: fixed;

        width: 300px;

        height: 300px;

        bottom: -150px;

        left: -100px;

        border-radius: 50%;

        background:

            radial-gradient(
                circle,
                rgba(190, 168, 225, 0.35),
                transparent 70%
            );

        filter: blur(15px);

        pointer-events: none;
    }


    /* =========================================
       メイン
       ========================================= */

    .admin-container {

        width: min(
            1000px,
            calc(100% - 32px)
        );

        margin: 50px auto;

        position: relative;

        z-index: 1;
    }


    /* =========================================
       ヘッダー
       ========================================= */

    .admin-header {

        text-align: center;

        margin-bottom: 35px;

        padding: 10px 20px;
    }


    .admin-symbol {

        font-size: 42px;

        margin-bottom: 8px;

        opacity: 0.9;

        text-shadow:
            0 0 18px rgba(
                143,
                119,
                181,
                0.35
            );
    }


    .admin-header h1 {

        margin: 0;

        font-size: 32px;

        font-weight: normal;

        letter-spacing: 0.18em;

        color: #403653;

        text-shadow:
            0 2px 8px rgba(
                70,
                55,
                100,
                0.12
            );
    }


    .admin-header p {

        margin: 12px 0 0;

        color: #77718b;

        font-size: 14px;

        letter-spacing: 0.08em;
    }


    /* =========================================
       ユーザー一覧カード
       ========================================= */

    .user-card {

        background:

            linear-gradient(
                135deg,
                rgba(255,255,255,0.88),
                rgba(249,247,253,0.78)
            );

        border:
            1px solid rgba(
                255,
                255,
                255,
                0.9
            );

        border-radius: 20px;

        padding: 30px;

        box-shadow:

            0 15px 40px rgba(
                74,
                60,
                100,
                0.12
            ),

            0 2px 8px rgba(
                74,
                60,
                100,
                0.06
            );

        backdrop-filter: blur(12px);

        position: relative;

        overflow: hidden;
    }


    /* =========================================
       カード装飾
       ========================================= */

    .user-card::before {

        content: "蓮";

        position: absolute;

        top: 12px;

        right: 20px;

        color: #c9a96e;

        font-size: 16px;

        opacity: 0.5;

        letter-spacing: 0.1em;
    }


    .user-card h2 {

        margin: 0 0 24px;

        font-size: 21px;

        font-weight: normal;

        letter-spacing: 0.12em;

        color: #514662;
    }


    /* =========================================
       テーブル
       ========================================= */

    .table-wrapper {

        overflow-x: auto;
    }


    .user-table {

        width: 100%;

        border-collapse: separate;

        border-spacing: 0;

        overflow: hidden;

        border:
            1px solid #e4deec;

        border-radius: 12px;
    }


    .user-table th {

        padding: 14px 16px;

        text-align: left;

        font-weight: normal;

        letter-spacing: 0.08em;

        font-size: 13px;

        color: #625976;

        background:

            linear-gradient(
                135deg,
                #f0ebf7,
                #ebe8f2
            );

        border-bottom:
            1px solid #ddd6e8;
    }


    .user-table td {

        padding: 15px 16px;

        background:
            rgba(
                255,
                255,
                255,
                0.65
            );

        border-bottom:
            1px solid #eeeaf3;

        font-size: 14px;
    }


    .user-table tr:last-child td {

        border-bottom: none;
    }


    .user-table tbody tr {

        transition:
            background 0.2s ease;
    }


    .user-table tbody tr:hover td {

        background:
            rgba(
                245,
                241,
                250,
                0.9
            );
    }


    /* =========================================
       権限
       ========================================= */

    .role-user {

        display: inline-block;

        padding: 5px 12px;

        border-radius: 999px;

        background: #edf2fa;

        color: #566b8c;

        border:
            1px solid #dce5f1;

        font-size: 12px;

        letter-spacing: 0.05em;
    }


    .role-admin {

        display: inline-block;

        padding: 5px 12px;

        border-radius: 999px;

        background: #f3eafa;

        color: #795b96;

        border:
            1px solid #e4d5f0;

        font-size: 12px;

        letter-spacing: 0.05em;
    }


    /* =========================================
       操作ボタン
       ========================================= */

    .action-button {

        border: none;

        border-radius: 8px;

        padding: 8px 13px;

        margin-right: 5px;

        cursor: pointer;

        font-family: inherit;

        font-size: 12px;

        letter-spacing: 0.03em;

        transition:
            transform 0.15s ease,
            box-shadow 0.15s ease,
            background 0.15s ease;
    }


    .action-button:hover {

        transform: translateY(-1px);

        box-shadow:
            0 4px 10px rgba(
                70,
                55,
                90,
                0.12
            );
    }


    .action-button:active {

        transform: translateY(0);
    }


    /* =========================================
       権限変更
       ========================================= */

    .role-button {

        background: #eee5f7;

        color: #70528d;

        border:
            1px solid #dfd1ed;
    }


    .role-button:hover {

        background: #e6d9f1;
    }


    /* =========================================
       削除
       ========================================= */

    .delete-button {

        background: #f6e8e8;

        color: #9b6666;

        border:
            1px solid #ecd5d5;
    }


    .delete-button:hover {

        background: #f0dcdc;
    }


    /* =========================================
       管理者本人
       ========================================= */

    .my-account {

        display: inline-flex;

        align-items: center;

        gap: 6px;

        color: #8b7d99;

        font-size: 12px;
    }


    .my-account::before {

        content: "狐";

        display: inline-flex;

        align-items: center;

        justify-content: center;

        width: 23px;

        height: 23px;

        border-radius: 50%;

        background: #f4f0f8;

        color: #806b91;

        font-size: 11px;

        border:
            1px solid #e5ddeb;
    }


    /* =========================================
       フッター
       ========================================= */

    .admin-footer {

        display: flex;

        justify-content: center;

        align-items: center;

        gap: 24px;

        margin-top: 25px;

        padding-bottom: 20px;
    }


    .admin-footer a {

        color: #756488;

        text-decoration: none;

        font-size: 13px;

        letter-spacing: 0.04em;

        transition:
            color 0.2s ease;
    }


    .admin-footer a:hover {

        color: #59446f;

        text-decoration: underline;
    }


    /* =========================================
       ログアウト
       ========================================= */

    .logout-button {

        border: none;

        background: transparent;

        color: #8a8493;

        cursor: pointer;

        padding: 0;

        font-family: inherit;

        font-size: 13px;

        letter-spacing: 0.04em;

        transition:
            color 0.2s ease;
    }


    .logout-button:hover {

        color: #5e5868;

        text-decoration: underline;
    }


    /* =========================================
       スマートフォン
       ========================================= */

    @media (max-width: 700px) {

        .admin-container {

            width: calc(100% - 20px);

            margin: 25px auto;
        }


        .admin-header {

            margin-bottom: 25px;
        }


        .admin-symbol {

            font-size: 34px;
        }


        .admin-header h1 {

            font-size: 25px;

            letter-spacing: 0.12em;
        }


        .admin-header p {

            font-size: 12px;
        }


        .user-card {

            padding: 18px;

            border-radius: 16px;
        }


        .user-card h2 {

            font-size: 18px;
        }


        .table-wrapper {

            margin: 0 -2px;
        }


        .user-table {

            min-width: 650px;
        }


        .admin-footer {

            flex-direction: column;

            gap: 12px;

            margin-top: 20px;
        }

    }

</style>

</head>


<body>


<div class="admin-container">


    <!-- =========================================
         ヘッダー
         ========================================= -->

    <header class="admin-header">

        <div class="admin-symbol">
            蓮
        </div>

        <h1>
            管理者の間
        </h1>

        <p>
            蓮の水面に集う者たちを見守ります
        </p>

    </header>


    <!-- =========================================
         ユーザー一覧
         ========================================= -->

    <section class="user-card">

        <h2>
            ユーザー一覧
        </h2>


        <div class="table-wrapper">

            <table class="user-table">

                <thead>

                    <tr>

                        <th>
                            ID
                        </th>

                        <th>
                            ユーザー名
                        </th>

                        <th>
                            権限
                        </th>

                        <th>
                            操作
                        </th>

                    </tr>

                </thead>


                <tbody>

                    <tr th:each="user : ${users}">


                        <!-- ID -->

                        <td th:text="${user.id}">
                            1
                        </td>


                        <!-- ユーザー名 -->

                        <td th:text="${user.username}">
                            test
                        </td>


                        <!-- 権限 -->

                        <td>

                            <span
                                th:if="${user.role == 'ADMIN'}"
                                class="role-admin">

                                ADMIN

                            </span>


                            <span
                                th:if="${user.role == 'USER'}"
                                class="role-user">

                                USER

                            </span>

                        </td>


                        <!-- 操作 -->

                        <td>


                            <!--
                                 ログイン中の本人以外
                            -->

                            <div
                                th:if="${user.username != currentUsername}">


                                <!-- 権限変更 -->

                                <form
                                    th:action="@{/admin/user/{id}/role(id=${user.id})}"
                                    method="post"
                                    style="display:inline;">

                                    <button
                                        type="submit"
                                        class="action-button role-button"
                                        th:text="${user.role == 'USER'
                                            ? 'ADMINに変更'
                                            : 'USERに変更'}">

                                        ADMINに変更

                                    </button>

                                </form>


                                <!-- 削除 -->

                                <form
                                    th:action="@{/admin/user/{id}/delete(id=${user.id})}"
                                    method="post"
                                    style="display:inline;">

                                    <button
                                        type="submit"
                                        class="action-button delete-button"
                                        onclick="return confirm(
                                            'このユーザーを削除しますか？'
                                        );">

                                        削除

                                    </button>

                                </form>


                            </div>


                            <!--
                                 ログイン中の本人
                            -->

                            <span
                                th:if="${user.username == currentUsername}"
                                class="my-account">

                                管理者本人

                            </span>


                        </td>

                    </tr>

                </tbody>

            </table>

        </div>

    </section>


    <!-- =========================================
         フッター
         ========================================= -->

    <div class="admin-footer">


        <a href="/">
            フォーム管理へ戻る
        </a>


        <form
            th:action="@{/logout}"
            method="post">

            <button
                type="submit"
                class="logout-button">

                ログアウト

            </button>

        </form>


    </div>


</div>


</body>

</html>
