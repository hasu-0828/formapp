<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>フォーム管理</title>


    <style>

        /* =========================================
           基本設定
           ========================================= */

        * {
            box-sizing: border-box;
        }


        html {
            min-height: 100%;
        }


        body {

            margin: 0;

            min-height: 100vh;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                "Hiragino Mincho Pro",
                "MS PMincho",
                serif;

            color: #eee9df;

            background:

                /* 月明かり */

                radial-gradient(
                    circle at 78% 12%,
                    rgba(224, 220, 196, 0.16) 0,
                    rgba(224, 220, 196, 0.07) 8%,
                    transparent 25%
                ),

                /* 紫の霧 */

                radial-gradient(
                    ellipse at 20% 70%,
                    rgba(111, 82, 126, 0.18),
                    transparent 42%
                ),

                /* 水面 */

                radial-gradient(
                    ellipse at 70% 100%,
                    rgba(66, 103, 112, 0.20),
                    transparent 45%
                ),

                linear-gradient(
                    145deg,
                    #09131c 0%,
                    #101e2a 42%,
                    #151d2b 70%,
                    #080f17 100%
                );

            overflow-x: hidden;

            position: relative;

        }


        /* =========================================
           背景の霧
           ========================================= */

        body::before {

            content: "";

            position: fixed;

            left: -10%;
            bottom: 5%;

            width: 120%;
            height: 180px;

            background:
                radial-gradient(
                    ellipse,
                    rgba(205, 212, 211, 0.06),
                    transparent 70%
                );

            filter: blur(25px);

            pointer-events: none;

        }


        body::after {

            content: "";

            position: fixed;

            left: 0;
            right: 0;
            bottom: 0;

            height: 32%;

            background:

                repeating-linear-gradient(
                    175deg,
                    transparent 0,
                    transparent 22px,
                    rgba(157, 182, 183, 0.035) 23px,
                    transparent 24px
                );

            opacity: 0.8;

            pointer-events: none;

        }


        /* =========================================
           月
           ========================================= */

        .moon {

            position: fixed;

            top: 55px;
            right: 9%;

            width: 125px;
            height: 125px;

            border-radius: 50%;

            background:

                radial-gradient(
                    circle at 35% 32%,
                    #fffdf3,
                    #e8e4d5 55%,
                    #c8c6ba
                );

            opacity: 0.82;

            box-shadow:

                0 0 25px
                rgba(255, 249, 220, 0.20),

                0 0 80px
                rgba(221, 217, 191, 0.08);

            z-index: 0;

            pointer-events: none;

        }


        /* 月のクレーター */

        .moon::before {

            content: "";

            position: absolute;

            width: 18px;
            height: 18px;

            border-radius: 50%;

            background: rgba(150, 148, 137, 0.10);

            top: 30px;
            left: 28px;

            box-shadow:

                30px 18px 0
                rgba(150, 148, 137, 0.07),

                12px 53px 0
                rgba(150, 148, 137, 0.08),

                55px 62px 0
                rgba(150, 148, 137, 0.06);

        }


        /* =========================================
           星
           ========================================= */

        .stars {

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 0;

        }


        .stars span {

            position: absolute;

            width: 2px;
            height: 2px;

            border-radius: 50%;

            background: rgba(238, 233, 214, 0.55);

            box-shadow:
                0 0 5px
                rgba(238, 233, 214, 0.25);

        }


        .star1 {
            top: 16%;
            left: 18%;
        }

        .star2 {
            top: 25%;
            left: 42%;
        }

        .star3 {
            top: 11%;
            left: 62%;
        }

        .star4 {
            top: 38%;
            left: 83%;
        }

        .star5 {
            top: 52%;
            left: 11%;
        }

        .star6 {
            top: 67%;
            left: 91%;
        }

        .star7 {
            top: 79%;
            left: 28%;
        }


        /* =========================================
           蓮の光
           
           絵文字ではなくCSSの光で表現
           ========================================= */

        .lotus-light {

            position: fixed;

            bottom: 65px;
            left: 7%;

            width: 150px;
            height: 80px;

            opacity: 0.24;

            z-index: 0;

            pointer-events: none;

        }


        .lotus-light::before,
        .lotus-light::after {

            content: "";

            position: absolute;

            bottom: 0;

            width: 75px;
            height: 42px;

            border-radius:
                100% 0 100% 0;

            border:
                1px solid
                rgba(211, 166, 186, 0.45);

            background:
                radial-gradient(
                    ellipse at center,
                    rgba(187, 121, 150, 0.16),
                    transparent 70%
                );

        }


        .lotus-light::before {

            left: 18px;

            transform:
                rotate(-25deg);

        }


        .lotus-light::after {

            right: 18px;

            transform:
                scaleX(-1)
                rotate(-25deg);

        }


        /* =========================================
           白狐の気配
           
           直接的な絵文字ではなく
           白い光と尻尾をイメージ
           ========================================= */

        .fox-light {

            position: fixed;

            right: 4%;

            bottom: 8%;

            width: 170px;
            height: 130px;

            opacity: 0.18;

            z-index: 0;

            pointer-events: none;

        }


        .fox-light::before {

            content: "";

            position: absolute;

            width: 110px;
            height: 65px;

            right: 10px;
            bottom: 20px;

            border-radius:
                70% 55% 65% 45%;

            background:
                radial-gradient(
                    ellipse,
                    rgba(245, 244, 234, 0.45),
                    rgba(221, 221, 214, 0.08) 70%,
                    transparent 75%
                );

            filter: blur(4px);

        }


        .fox-light::after {

            content: "";

            position: absolute;

            width: 115px;
            height: 45px;

            right: 40px;
            bottom: 8px;

            border-radius: 50%;

            border-top:
                2px solid
                rgba(242, 240, 225, 0.30);

            transform:
                rotate(-18deg);

            filter: blur(1px);

        }


        /* =========================================
           メインコンテナ
           ========================================= */

        .container {

            position: relative;

            z-index: 2;

            width: min(1000px, calc(100% - 40px));

            margin: 0 auto;

            padding: 65px 0 45px;

        }


        /* =========================================
           ヘッダー
           ========================================= */

        header {

            text-align: center;

            margin-bottom: 45px;

        }


        .kigo {

            color: #c99bae;

            font-size: 12px;

            letter-spacing: 8px;

            margin-bottom: 18px;

            opacity: 0.85;

        }


        h1 {

            margin: 0;

            color: #f7f3eb;

            font-size: 38px;

            font-weight: normal;

            letter-spacing: 9px;

            text-shadow:
                0 2px 20px
                rgba(255,255,255,0.08);

        }


        .subtitle {

            margin-top: 17px;

            color: #aeb9bf;

            font-size: 13px;

            letter-spacing: 4px;

        }


        .header-line {

            width: 130px;

            height: 1px;

            margin: 25px auto 0;

            background:
                linear-gradient(
                    to right,
                    transparent,
                    rgba(205, 171, 151, 0.65),
                    transparent
                );

        }


        /* =========================================
           新規作成
           ========================================= */

        .create-area {

            text-align: center;

            margin-bottom: 35px;

        }


        .create-button {

            display: inline-block;

            padding: 14px 35px;

            border:
                1px solid
                rgba(203, 163, 178, 0.55);

            border-radius: 4px;

            color: #f6eee9;

            text-decoration: none;

            letter-spacing: 3px;

            background:
                linear-gradient(
                    135deg,
                    rgba(117, 71, 92, 0.72),
                    rgba(68, 54, 76, 0.78)
                );

            box-shadow:
                0 8px 30px
                rgba(0,0,0,0.25),

                inset 0 1px 0
                rgba(255,255,255,0.08);

            transition:
                0.25s ease;

        }


        .create-button:hover {

            transform:
                translateY(-2px);

            background:
                linear-gradient(
                    135deg,
                    rgba(142, 88, 111, 0.82),
                    rgba(82, 64, 91, 0.88)
                );

            box-shadow:
                0 12px 35px
                rgba(0,0,0,0.32),

                0 0 20px
                rgba(192, 138, 161, 0.08);

        }


        /* =========================================
           フォーム一覧パネル
           ========================================= */

        .form-panel {

            border:
                1px solid
                rgba(207, 190, 165, 0.20);

            background:
                linear-gradient(
                    135deg,
                    rgba(20, 30, 39, 0.88),
                    rgba(12, 21, 29, 0.82)
                );

            border-radius: 8px;

            padding: 10px;

            box-shadow:
                0 20px 60px
                rgba(0,0,0,0.35),

                inset 0 1px 0
                rgba(255,255,255,0.035);

            backdrop-filter:
                blur(10px);

        }


        /* =========================================
           テーブル
           ========================================= */

        table {

            width: 100%;

            border-collapse: collapse;

        }


        thead {

            background:
                rgba(201, 174, 145, 0.055);

        }


        th {

            padding: 17px 20px;

            color: #cbbda8;

            font-size: 12px;

            font-weight: normal;

            letter-spacing: 3px;

            text-align: left;

            border-bottom:
                1px solid
                rgba(204, 188, 162, 0.18);

        }


        td {

            padding: 20px;

            border-bottom:
                1px solid
                rgba(204, 188, 162, 0.09);

            vertical-align: middle;

        }


        tbody tr {

            transition:
                background 0.2s ease;

        }


        tbody tr:hover {

            background:
                rgba(255,255,255,0.035);

        }


        tbody tr:last-child td {

            border-bottom: none;

        }


        /* =========================================
           フォーム名
           ========================================= */

        .form-name {

            color: #eee9df;

            text-decoration: none;

            font-size: 17px;

            letter-spacing: 1px;

            transition:
                color 0.2s ease;

        }


        .form-name:hover {

            color: #d7a9ba;

        }


        /* =========================================
           公開状態
           ========================================= */

        .status {

            display: inline-block;

            min-width: 75px;

            padding: 6px 12px;

            border-radius: 3px;

            text-align: center;

            font-size: 11px;

            letter-spacing: 1px;

        }


        .published {

            color: #d4e1d4;

            border:
                1px solid
                rgba(135, 168, 139, 0.30);

            background:
                rgba(79, 118, 84, 0.16);

        }


        .unpublished {

            color: #b9bec0;

            border:
                1px solid
                rgba(160,160,160,0.18);

            background:
                rgba(120,120,120,0.10);

        }


        /* =========================================
           削除ボタン
           ========================================= */

        .delete-button {

            padding: 7px 16px;

            border:
                1px solid
                rgba(176, 105, 112, 0.35);

            border-radius: 3px;

            color: #cbaeb0;

            background:
                rgba(93, 45, 51, 0.22);

            font-family: inherit;

            cursor: pointer;

            transition:
                0.2s ease;

        }


        .delete-button:hover {

            color: #f2dada;

            border-color:
                rgba(205, 122, 130, 0.55);

            background:
                rgba(125, 54, 62, 0.38);

        }


        /* =========================================
           フォームがない場合
           ========================================= */

        .empty {

            padding: 75px 20px;

            text-align: center;

            color: #929da2;

            border:
                1px solid
                rgba(207, 190, 165, 0.16);

            border-radius: 8px;

            background:
                rgba(11, 20, 28, 0.65);

            letter-spacing: 2px;

        }


        .empty::before {

            content: "";

            display: block;

            width: 75px;
            height: 35px;

            margin:
                0 auto 25px;

            border-radius:
                50% 50% 45% 45%;

            border-top:
                1px solid
                rgba(208, 164, 182, 0.45);

            border-left:
                1px solid
                rgba(208, 164, 182, 0.30);

            border-right:
                1px solid
                rgba(208, 164, 182, 0.30);

            transform:
                rotate(0deg);

            opacity: 0.7;

        }


        /* =========================================
           フッター
           ========================================= */

        footer {

            margin-top: 35px;

            text-align: center;

            color: #69767c;

            font-size: 11px;

            letter-spacing: 3px;

        }


        /* =========================================
           スマートフォン
           ========================================= */

        @media (max-width: 650px) {

            .container {

                width:
                    calc(100% - 24px);

                padding-top: 40px;

            }


            .moon {

                width: 85px;
                height: 85px;

                top: 30px;
                right: 5%;

                opacity: 0.6;

            }


            h1 {

                font-size: 27px;

                letter-spacing: 5px;

            }


            .subtitle {

                font-size: 10px;

                letter-spacing: 2px;

            }


            .form-panel {

                padding: 4px;

            }


            th {

                padding: 13px 8px;

                font-size: 10px;

                letter-spacing: 1px;

            }


            td {

                padding: 15px 8px;

            }


            .form-name {

                font-size: 14px;

            }


            .status {

                min-width: auto;

                padding: 5px 7px;

                font-size: 9px;

            }


            .delete-button {

                padding: 6px 9px;

                font-size: 10px;

            }


            .fox-light {

                right: -30px;

                bottom: 5%;

                opacity: 0.12;

            }


            .lotus-light {

                left: -25px;

                opacity: 0.16;

            }

        }

    </style>

</head>


<body>


    <!-- =========================================
         背景装飾
         ========================================= -->

    <div class="moon"></div>


    <div class="stars">

        <span class="star1"></span>
        <span class="star2"></span>
        <span class="star3"></span>
        <span class="star4"></span>
        <span class="star5"></span>
        <span class="star6"></span>
        <span class="star7"></span>

    </div>


    <!-- 蓮をイメージした光 -->

    <div class="lotus-light"></div>


    <!-- 白狐をイメージした光 -->

    <div class="fox-light"></div>



    <!-- =========================================
         メイン
         ========================================= -->

    <div class="container">


        <!-- =====================================
             ヘッダー
             ===================================== -->

        <header>

            <div class="kigo">
                ─　蓮　─
            </div>


            <h1>
                フォーム管理
            </h1>


            <div class="subtitle">
                月明かりの下、問いを集める
            </div>


            <div class="header-line"></div>

        </header>



        <!-- =====================================
             新規フォーム作成
             ===================================== -->

        <div class="create-area">

            <a
                th:href="@{/form/create}"

                class="create-button">

                ＋　新しいフォームを作成

            </a>

        </div>



        <!-- =====================================
             フォーム一覧
             ===================================== -->

        <div
            th:if="${!forms.isEmpty()}"

            class="form-panel">


            <table>


                <thead>

                    <tr>

                        <th>
                            フォーム
                        </th>

                        <th>
                            公開状態
                        </th>

                        <th>
                            操作
                        </th>

                    </tr>

                </thead>


                <tbody>


                    <tr
                        th:each="form : ${forms}">


                        <!-- フォーム名 -->

                        <td>

                            <a

                                th:href="@{/form/{id}(id=${form.id})}"

                                th:text="${form.title}"

                                class="form-name">

                                フォーム名

                            </a>

                        </td>



                        <!-- 公開状態 -->

                        <td>


                            <span

                                th:if="${form.published}"

                                class="status published">

                                公開中

                            </span>


                            <span

                                th:if="${!form.published}"

                                class="status unpublished">

                                未公開

                            </span>


                        </td>



                        <!-- 削除 -->

                        <td>


                            <form

                                th:action="@{/form/{id}/delete(id=${form.id})}"

                                method="post">


                                <button

                                    type="submit"

                                    class="delete-button"

                                    onclick="return confirm('このフォームを削除しますか？\n質問・回答データもすべて削除されます。');">

                                    削除

                                </button>

                            </form>


                        </td>


                    </tr>


                </tbody>


            </table>


        </div>



        <!-- =====================================
             フォームがない場合
             ===================================== -->

        <div

            th:if="${forms.isEmpty()}"

            class="empty">

            まだフォームがありません。


            <br><br>


            新しいフォームを作成してみましょう。

        </div>



        <!-- =====================================
             フッター
             ===================================== -->

        <footer>

            ❖　静寂の中に、ひとつの問いを　❖

        </footer>


    </div>


</body>

</html>
