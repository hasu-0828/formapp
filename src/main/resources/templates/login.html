<!DOCTYPE html>

<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>


<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>ログイン - 蓮狐</title>

<style>

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;

        display: flex;
        justify-content: center;
        align-items: center;

        font-family:
            "Yu Mincho",
            "Hiragino Mincho ProN",
            "Noto Serif JP",
            serif;

        background:
            linear-gradient(
                135deg,
                #f8f5fc,
                #e9e6f2,
                #e5edf5
            );

        color: #403653;
    }

    .login-container {

        width: 420px;
        max-width: calc(100% - 30px);

        padding: 40px;

        background: rgba(255,255,255,0.9);

        border-radius: 20px;

        box-shadow:
            0 15px 40px rgba(70,55,100,0.15);

    }

    h1 {

        margin: 0 0 30px;

        text-align: center;

        font-size: 28px;

        font-weight: normal;

        letter-spacing: 0.15em;

    }

    .form-group {

        margin-bottom: 20px;

    }

    label {

        display: block;

        margin-bottom: 8px;

        font-size: 14px;

    }

    input {

        display: block;

        width: 100%;

        padding: 12px;

        border: 1px solid #d8d1e2;

        border-radius: 8px;

        font-size: 14px;

    }

    button {

        display: block;

        width: 100%;

        padding: 13px;

        border: none;

        border-radius: 8px;

        color: white;

        background: #806a99;

        cursor: pointer;

        font-family: inherit;

        font-size: 14px;

    }

    button:hover {

        background: #705a88;

    }

    .signup {

        margin-top: 25px;

        padding-top: 20px;

        border-top: 1px solid #e5dfeb;

        text-align: center;

    }

    .signup a {

        color: #75618b;

        text-decoration: none;

    }

    .message {

        margin-bottom: 20px;

        padding: 10px;

        text-align: center;

        background: #f8e9ec;

        border: 1px solid #ecd4d9;

        border-radius: 8px;

        color: #8f5f67;

        font-size: 13px;

    }

</style>


</head>

<body>


<main class="login-container">

    <h1>
        ログイン
    </h1>


    <div
        th:if="${param.error}"
        class="message">

        ユーザー名またはパスワードが違います。

    </div>


    <div
        th:if="${param.logout}"
        class="message">

        ログアウトしました。

    </div>


    <form
        th:action="@{/login}"
        method="post">


        <div class="form-group">

            <label for="username">
                ユーザー名
            </label>

            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required>

        </div>


        <div class="form-group">

            <label for="password">
                パスワード
            </label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required>

        </div>


        <button type="submit">

            ログイン

        </button>


    </form>


    <div class="signup">

        <a href="/signup">
            新規登録
        </a>

    </div>

</main>


</body>

</html>
